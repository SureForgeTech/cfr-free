# Publish server.json to the official MCP Registry as io.github.SureForgeTech/sureforge-cfr.
#
# Signs in with this repository's GitHub OIDC token, which proves the listing comes from
# the SureForgeTech organization. No secret is stored. The registry checks that the npm
# package at server.json's version carries the matching `mcpName`, so this waits until
# that version is visible on npm (the release workflow publishes it).
#
# Runs on each version tag. To list a release that is already out, run it by hand
# (Actions → "MCP Registry" → Run workflow) and give that release's tag, e.g. v0.2.2.
name: MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose server.json to publish (for example v0.2.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: publish to the MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # registry login via GitHub OIDC; no stored secret
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: versions agree
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          PKG="$(jq -r .version package.json)"
          SRV="$(jq -r .version server.json)"
          SRVPKG="$(jq -r '.packages[0].version' server.json)"
          NAME="$(jq -r .mcpName package.json)"
          SRVNAME="$(jq -r .name server.json)"
          test "$PKG" = "$SRV" && test "$PKG" = "$SRVPKG" || { echo "server.json version ($SRV/$SRVPKG) != package.json ($PKG)"; exit 1; }
          test "$NAME" = "$SRVNAME" || { echo "package.json mcpName ($NAME) != server.json name ($SRVNAME)"; exit 1; }
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; fi
          test -n "$TAG" || { echo "no release tag to publish"; exit 1; }
          test "${TAG#v}" = "$PKG" || { echo "tag ${TAG} != package.json $PKG"; exit 1; }
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: wait for the version on npm
        run: |
          for _ in $(seq 1 50); do
            if [ "$(npm view "cfr-free@${PKG}" mcpName --prefer-online 2>/dev/null)" = "$(jq -r .mcpName package.json)" ]; then
              echo "cfr-free@${PKG} is on npm with the matching mcpName"; exit 0
            fi
            sleep 30
          done
          echo "cfr-free@${PKG} did not appear on npm with the matching mcpName within 25 minutes"; exit 1
      - name: install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: sign in with this repository's OIDC token
        run: ./mcp-publisher login github-oidc
      - name: publish
        run: ./mcp-publisher publish
